<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Website Title -->
    <title>MySecretNotes - Reset Password</title>

    <!-- Styles -->
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:500,700&display=swap&subset=latin-ext"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:400,400i,600&display=swap&subset=latin-ext"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static',filename='css/bootstrap.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static',filename='css/fontawesome-all.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static',filename='css/swiper.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static',filename='css/magnific-popup.css') }}"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static',filename='css/styles.css') }}"
      rel="stylesheet"
    />
    <!-- Favicon  -->
    <link
      rel="icon"
      href="{{ url_for('static',filename='images/favicon.png') }}"
    />
  </head>
  <body data-spy="scroll" data-target=".fixed-top">
    <!-- Preloader -->
    <div class="spinner-wrapper">
      <div class="spinner">
        <div class="bounce1"></div>
        <div class="bounce2"></div>
        <div class="bounce3"></div>
      </div>
    </div>
    <!-- end of preloader -->

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark navbar-custom fixed-top">
      <!-- Image Logo -->
      <a class="navbar-brand logo-image" href="/"
        ><img
          src="{{ url_for('static',filename='images/untitled.svg') }}"
          alt="alternative"
      /></a>

      <!-- Mobile Menu Toggle Button -->
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarsExampleDefault"
        aria-controls="navbarsExampleDefault"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-awesome fas fa-bars"></span>
        <span class="navbar-toggler-awesome fas fa-times"></span>
      </button>
      <!-- end of mobile menu toggle button -->

      <div class="collapse navbar-collapse" id="navbarsExampleDefault">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link page-scroll" href="/register/">REGISTER</a>
          </li>
          <li class="nav-item">
            <a class="nav-link page-scroll" href="/login/">LOGIN</a>
          </li>
        </ul>
        <span class="nav-item social-icons">
          <span class="fa-stack">
            <a href="#your-link">
              <span class="hexagon"></span>
              <i class="fab fa-facebook-f fa-stack-1x"></i>
            </a>
          </span>
          <span class="fa-stack">
            <a href="#your-link">
              <span class="hexagon"></span>
              <i class="fab fa-twitter fa-stack-1x"></i>
            </a>
          </span>
        </span>
      </div>
    </nav>
    <!-- end of navbar -->

    <!-- Header -->
    <header id="header" class="header">
      <div class="header-content">
        <div class="container">
          <div class="row">
            <div class="col-lg-12">
              <div class="container">
                <h1>Reset password</h1>

                <br />
                <form action="" method="post">
                  <input
                    type="text"
                    placeholder="Username"
                    name="username"
                    value="{{ request.form.username }}"
                  />
                  {% if usererror %}
                  <p class="p-large"><strong>Error:</strong> {{ usererror }}</p>
                  {% endif %}
                  <br /><br />
                  <input
                    type="text"
                    placeholder="Email address"
                    name="email"
                    value="{{ request.form.email }}"
                  />
                  {% if emailerror %}
                  <p class="p-large">
                    <strong>Error:</strong> {{ emailerror }}
                  </p>
                  {% endif %}
                  <br /><br />
                  <input
                    class="btn-solid-lg"
                    type="submit"
                    value="Restore password"
                  />
                </form>
              </div>
              <div class="p-large">
                <div><a href="/login/" class="p-large">back to login</a></div>
              </div>
            </div>
            <!-- end of col -->
          </div>
          <!-- end of row -->
        </div>
        <!-- end of container -->
      </div>
      <!-- end of header-content -->
    </header>
    <!-- end of header -->

    <!-- Scripts -->
    <script src="{{ url_for('static',filename='js/jquery.min.js') }}"></script>
    <!-- jQuery for Bootstrap's JavaScript plugins -->
    <script src="{{ url_for('static',filename='js/popper.min.js') }}"></script>
    <!-- Popper tooltip library for Bootstrap -->
    <script src="{{ url_for('static',filename='js/bootstrap.min.js') }}"></script>
    <!-- Bootstrap framework -->
    <script src="{{ url_for('static',filename='js/jquery.easing.min.js') }}"></script>
    <!-- jQuery Easing for smooth scrolling between anchors -->
    <script src="{{ url_for('static',filename='js/swiper.min.js') }}"></script>
    <!-- Swiper for image and text sliders -->
    <script src="{{ url_for('static',filename='js/jquery.magnific-popup.js') }}"></script>
    <!-- Magnific Popup for lightboxes -->
    <script src="{{ url_for('static',filename='js/morphext.min.js') }}"></script>
    <!-- Morphtext rotating text in the header -->
    <script src="{{ url_for('static',filename='js/isotope.pkgd.min.js') }}"></script>
    <!-- Isotope for filter -->
    <script src="{{ url_for('static',filename='js/validator.min.js') }}"></script>
    <!-- Validator.js - Bootstrap plugin that validates forms -->
    <script src="{{ url_for('static',filename='js/scripts.js') }}"></script>

    <!-- Reset password -->
    {% if show_popup %}
    <script>
      alert(
        "Our mail service is currently down. So unfortunately you will have to remember your password..",
      );
    </script>
    {% endif %}
  </body>
</html>
