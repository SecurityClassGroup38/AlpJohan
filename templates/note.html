<li class="card notes__card-wrapper">
  <div class="card-body notes__card-body">
    <h5 class="card-title notes__card-title">Public Note ID: {{note[5]}}</h5>
    <h6 class="card-subtitle mb-2 notes__card-subtitle">
      note written by userID:
      <span class="notes__card-subtitle--date">{{ note[2] }}</span>
    </h6>
    <h6 class="card-subtitle mb-2 notes__card-subtitle">
      note written on:
      <span class="notes__card-subtitle--date">{{ note[3] }}</span>
    </h6>
    <p class="card-text">{{ note[4] }}</p>
    

  </div>
</li>
